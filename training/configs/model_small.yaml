model_name: perkunas-small
vocab_size: 32000
hidden_size: 384
intermediate_size: 1024
num_hidden_layers: 8
num_attention_heads: 6
num_key_value_heads: 6
max_position_embeddings: 1024
rope_theta: 10000.0
rms_norm_eps: 1.0e-5
activation: swiglu
dropout: 0.0
attention_dropout: 0.0
tie_word_embeddings: true
initializer_range: 0.02
pad_token_id: 0
bos_token_id: 1
eos_token_id: 2
unk_token_id: 3
modality_extension:
  enabled: true
  projection_dim: 384
  adapter_init_std: 0.02
auxiliary_heads:
  embedding: false
  classification: false
  reranking: false
